# cava profile used by MusicEffectService to feed the clock-side visualiser.
# Streams raw ascii frames ("v1;v2;...;vN;\n") on stdout; the service turns each
# bar into a 0..1 magnitude and the visualiser mirrors it around the centre line.
[general]
bars = 12
framerate = 60

[input]
# pulse (via pipewire-pulse) with source=auto taps the default sink's monitor,
# so it reacts to whatever is actually playing out of the speakers/headphones.
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
channels = mono
