# WebRTC echo cancellation + noise suppression for laptop mic with speakers.
# Internal stage only: 61-rnnoise.conf consumes it and exposes "Noise-Canceled Mic".
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      # Use the default sink's monitor as the echo reference,
      # so playback routing doesn't need to change.
      monitor.mode = true
      aec.args = {
        webrtc.noise_suppression = true
        webrtc.gain_control = false  # AGC re-amplifies residual noise in pauses
      }
      capture.props = {
        node.name = "echo-cancel-capture"
        node.passive = true
        # Pin to the laptop mic: following the default source would loop,
        # since the default is now the RNNoise output fed by this module.
        target.object = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic1__source"
        node.dont-fallback = true
      }
      source.props = {
        node.name = "echo-cancel-source"
        node.description = "Echo-Cancel Mic"
        # Internal class hides it from app device lists (pulse/Meet) and from
        # default-source selection; only the RNNoise internal stream links to it.
        media.class = "Audio/Source/Internal"
      }
      sink.props = {
        node.name = "echo-cancel-sink"
        node.description = "Echo-Cancel Sink"
      }
    }
  }
]
