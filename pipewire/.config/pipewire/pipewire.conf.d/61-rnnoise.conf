# RNNoise voice denoiser chained after the WebRTC echo canceller:
#   laptop mic -> echo-cancel-source -> RNNoise -> "Noise-Canceled Mic"
# Select "Noise-Canceled Mic" as the microphone in Meet.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Noise-Canceled Mic"
      media.name = "Noise-Canceled Mic"
      filter.graph = {
        nodes = [
          { type = ladspa
            name = rnnoise
            plugin = /usr/lib/ladspa/librnnoise_ladspa.so
            label = noise_suppressor_mono
            control = {
              "VAD Threshold (%)" = 50.0
              "VAD Grace Period (ms)" = 200
              "Retroactive VAD Grace (ms)" = 0
            }
          }
        ]
      }
      capture.props = {
        node.name = "capture.rnnoise_source"
        node.passive = true
        audio.rate = 48000
        target.object = "echo-cancel-source"
        media.class = "Stream/Input/Audio/Internal"
      }
      playback.props = {
        node.name = "rnnoise_source"
        media.class = Audio/Source
        priority.session = 2100   # above ALSA mics, so it wins default-source selection
        audio.rate = 48000
      }
    }
  }
]
